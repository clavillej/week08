name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:


jobs:

# ===================================
# Terraform Configuration Validation
# ===================================

  terraform-validation:
    name: Validate Terraform
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Initialise Terraform for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Scan and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Backend tests and Terraform validation must pass before building
    needs:
      - backend-test
      - terraform-validation

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

    # Build Docker

      - name: Docker Scout vulnerability report
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          command: cves
          image: local://${{ matrix.image }}:${{ github.sha }}
          sarif-file: scout-${{ matrix.image }}.sarif
          summary: true
          write-comment: false
          # Report findings during initial integration.
          exit-code: false

      - name: Docker Scout recommendations
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          command: recommendations
          image: local://${{ matrix.image }}:${{ github.sha }}
          summary: true
          write-comment: false

      - name: Upload Docker Scout report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scout-${{ matrix.image }}-${{ github.run_id }}
          path: scout-${{ matrix.image }}.sarif
          if-no-files-found: warn
          retention-days: 7

    # Login to Azure

      - name: Login to Azure
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Tag and push scanned image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          docker tag \
            ${{ matrix.image }}:${{ github.sha }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}